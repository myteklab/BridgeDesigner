<confirmation-dialog
  #dialog
  [headerHtml]="'Contest welcome'"
  [buttons]="['close']"
  [timeout]="6000"
  [width]="800"
  [height]="380"
>
  <div class="container">
    <div class="welcome">Welcome and good luck with...</div>
    <div class="contest-name">
      <div>
        @if (contestParametersService.parameters.contestName) {
          {{ contestParametersService.parameters.contestName }}
        } @else {
          Your local
        }
      </div>
    </div>
    <div class="subtitle">Bridge Design Contest</div>
    <div class="explain">This is a special Bridge Designer version just for contest use.</div>
  </div>
</confirmation-dialog>
